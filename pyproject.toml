[tool.poetry]
name = "ai_web_nav"
version = "0.1.0"
description = "Cross-site product browsing, extraction and ranking skeleton"
authors = ["You <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.100"
uvicorn = {extras=["standard"], version="^0.22"}
pydantic = "^2.6"
playwright = "^1.40"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
